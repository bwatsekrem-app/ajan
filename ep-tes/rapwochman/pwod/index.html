<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rapwochman BSO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f3f5f8;--kat:#ffffff;--kat2:#f8fafc;--tx:#14202e;--mut:#5f6b7a;--li:#e2e7ee;--li2:#eef1f5;
  --pri:#094368;--pri2:#0d5a8a;--pri-t:#e6eef5;--ak:#14a39a;
  --ok:#0f7a46;--okb:#e5f5ec;--er:#b42318;--erb:#fdecea;--av:#a15c07;--avb:#fff3e0;--th:#f1f4f8;--imp:#eaf6f1;
  --om:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--om2:0 10px 30px rgba(16,24,40,.12);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1218;--kat:#151c25;--kat2:#18212b;--tx:#e7ecf2;--mut:#93a0ae;--li:#26313d;--li2:#1d2731;
  --pri:#4ea3db;--pri2:#6cb6e6;--pri-t:#132b3d;--ak:#3cc7bd;
  --ok:#4cc38a;--okb:#123323;--er:#ff8076;--erb:#3a1a18;--av:#f5b54f;--avb:#352610;--th:#1a232d;--imp:#12302a;
  --om:0 1px 2px rgba(0,0,0,.4);--om2:0 10px 30px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"tnum" 1}
/* ---------- Antèt ---------- */
header{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  padding:12px 22px;background:linear-gradient(120deg,#062f4a 0%,#094368 55%,#0e5f86 100%);color:#fff;box-shadow:0 2px 10px rgba(6,47,74,.25)}
.mak{display:flex;gap:12px;align-items:center}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.sou{font-size:12px;opacity:.75;margin-top:1px}
header .row{align-items:center}
header label{color:rgba(255,255,255,.75)}
header select{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
header select option{color:#14202e}
header button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
header button:hover{background:rgba(255,255,255,.2)}
.moun{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.95}
.moun:not(:empty)::before{content:"";width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.env{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:.04em}
.env.tes{background:#fde68a;color:#78350f}.env.prod{background:#fecaca;color:#7f1d1d}
/* ---------- Kò ---------- */
main{padding:20px 22px 40px;max-width:1440px;margin:auto}
h2{font-size:15px;margin:0 0 10px;font-weight:650;letter-spacing:-.01em}
.kat{background:var(--kat);border:1px solid var(--li);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--om)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);font-weight:500}
input,select,button,textarea{font:inherit}
input,select{padding:8px 11px;border:1px solid var(--li);border-radius:9px;background:var(--kat);color:var(--tx);min-height:38px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-t)}
button{padding:8px 14px;border:1px solid var(--li);border-radius:9px;background:var(--kat);color:var(--tx);cursor:pointer;font-weight:550;min-height:38px;transition:background .15s,border-color .15s,box-shadow .15s}
button:hover{background:var(--th)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--pri-t)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 1px 2px rgba(9,67,104,.3)}
button.pri:hover{background:var(--pri2);border-color:var(--pri2)}
button.danje{background:var(--er);border-color:var(--er);color:#fff}
button:disabled{opacity:.5;cursor:default}
.mut{color:var(--mut)}
/* Filtè */
.filt{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between}
.filt .gwoup{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.chips{display:inline-flex;background:var(--th);border-radius:10px;padding:3px;gap:2px}
.chips button{border:none;background:transparent;min-height:32px;padding:6px 12px;border-radius:8px;color:var(--mut);font-size:13px}
.chips button:hover{background:var(--kat);color:var(--tx)}
.swich{flex-direction:row!important;align-items:center;gap:8px!important;cursor:pointer;color:var(--tx)!important;font-weight:500}
.swich input{appearance:none;width:34px;height:20px;min-height:0;padding:0;border-radius:20px;background:var(--li);position:relative;cursor:pointer;border:none;transition:background .15s}
.swich input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.swich input:checked{background:var(--ak)}.swich input:checked::after{left:16px}
#chaje{min-width:120px}
.prog{height:4px;background:var(--li2);border-radius:4px;overflow:hidden;margin-top:12px}
.prog>div{height:100%;background:linear-gradient(90deg,var(--pri),var(--ak));width:0;transition:width .25s}
/* Onglè */
.tabs{display:flex;gap:2px;flex-wrap:wrap;align-items:center;margin:4px 0 16px;border-bottom:1px solid var(--li)}
.tabs button[data-t]{white-space:nowrap;flex:none;border:none;background:transparent;border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--mut);padding:10px 14px;min-height:42px}
.tabs button[data-t]:hover{color:var(--tx);background:transparent}
.tabs button[data-t].on{color:var(--pri);border-bottom-color:var(--pri);font-weight:650}
.tabs .aksyon{display:flex;gap:6px;margin-left:auto;padding-bottom:6px}
.tabs .aksyon button{min-height:34px;padding:6px 12px;font-size:13px}
/* KPI */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi .k{background:var(--kat);border:1px solid var(--li);border-radius:var(--r);padding:14px 16px;box-shadow:var(--om);position:relative;overflow:hidden}
.kpi .k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pri)}
.kpi .k.ok::before{background:var(--ok)}.kpi .k.er::before{background:var(--er)}.kpi .k.av::before{background:var(--av)}.kpi .k.ak::before{background:var(--ak)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:550;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi .k.er .v{color:var(--er)}.kpi .k.ok .v{color:var(--ok)}
/* Tablo */
.wrap{overflow:auto;border:1px solid var(--li);border-radius:12px;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;border-bottom:1px solid var(--li2);text-align:right;white-space:nowrap}
th{background:var(--th);font-weight:600;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left}
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:var(--kat2)}
th.imp,td.imp{background:var(--imp)!important;font-weight:700}
th.imp{color:var(--ok)}
tr.tot td{font-weight:700;border-top:2px solid var(--li);background:var(--th)!important}
tr.klik{cursor:pointer}tr.klik:hover td{background:var(--pri-t)!important}
td.ekar{color:var(--er);font-weight:700}
td.ekar::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--er);margin-right:7px;vertical-align:middle}
td.okc{color:var(--ok);font-weight:600}
td.okc::before{content:"✓ ";font-weight:700}
.okc{color:var(--ok)}
.na{color:var(--mut)}
.chip{display:inline-block;white-space:nowrap;margin-bottom:2px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:650;vertical-align:middle;margin-left:4px}
.chip.er{background:var(--erb);color:var(--er)}.chip.ok{background:var(--okb);color:var(--ok)}.chip.av{background:var(--avb);color:var(--av)}
.err{background:var(--erb);color:var(--er);padding:10px 12px;border-radius:10px;margin-top:10px;white-space:pre-wrap;border:1px solid color-mix(in srgb,var(--er) 25%,transparent)}
.note{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.55}
.kat>h2+.note{margin-top:-4px}
.kol3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px}
.kol3>*{min-width:0}
.wrap.lis2{max-height:50vh}
th.tl,td.tl{text-align:left}
.spT td.tl{white-space:normal;min-width:110px}
.spT td{padding-left:8px;padding-right:8px}
.vid{text-align:center;padding:48px 20px;color:var(--mut)}
.vid svg{width:44px;height:44px;opacity:.5;margin-bottom:10px}
/* Fenèt */
dialog{border:none;border-radius:16px;background:var(--kat);color:var(--tx);max-width:min(1100px,96vw);width:100%;padding:0;box-shadow:var(--om2)}
dialog::backdrop{background:rgba(10,20,30,.45);backdrop-filter:blur(2px)}
dialog .tet{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--li)}
dialog .tet h2{margin:0}
dialog .ko{padding:16px 18px;max-height:75vh;overflow:auto}
.mod-ko{padding:18px;max-height:60vh;overflow:auto}
.mod-ko .lis{margin-top:12px;border:1px solid var(--li);border-radius:10px;max-height:38vh;overflow:auto}
.mod-ko .lis table{font-size:13px}
.mod-ko textarea{width:100%;min-height:76px;padding:10px;border:1px solid var(--li);border-radius:10px;background:var(--kat);color:var(--tx);margin-top:12px}
.mod-pye{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--li);background:var(--kat2);border-radius:0 0 16px 16px}
.mod-ik{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;margin-right:12px;flex:none}
.mod-ik.ok{background:var(--okb);color:var(--ok)}.mod-ik.av{background:var(--avb);color:var(--av)}.mod-ik.er{background:var(--erb);color:var(--er)}.mod-ik.in{background:var(--pri-t);color:var(--pri)}
.mod-tet{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--li)}
.mod-tet h2{margin:0;font-size:16px}
.mod-tot{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-weight:650}
#mod{max-width:min(660px,94vw)}
/* Login */
#login{max-width:420px;margin:60px auto;padding:28px}
#login h2{font-size:18px}
#login form{flex-direction:column;align-items:stretch}
#login button{margin-top:6px}
/* Enprime + telefòn */
@media print{header,.tabs,.noprint,.kpi{display:none!important}body{background:#fff}.kat{border:none;box-shadow:none}.wrap{max-height:none;border:none}}
@media (max-width:700px){
  header{padding:10px 14px}.sou{display:none}
  main{padding:14px 12px 30px}
  .kat{padding:14px}
  th,td{padding:7px 9px;font-size:13px}
  .tabs{overflow-x:auto;flex-wrap:nowrap}.tabs .aksyon{display:none}
  .kpi{grid-template-columns:repeat(2,1fr);gap:10px}.kpi .v{font-size:19px}
}
</style>
</head>
<body>
<header>
  <div class="mak">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg></div>
    <div><div style="display:flex;gap:10px;align-items:center"><h1>Rapwochman BSO</h1><span id="envChip" class="env prod">PWODIKSYON</span></div>
    <div class="sou">Supabase · Importation Globale · Declaration Agent</div></div>
  </div>
  <div class="row">
    <select id="env" aria-label="Baz Supabase"><option value="prod">Pwodiksyon</option></select>
    <span id="moun" class="moun"></span>
    <button id="soti" hidden>Dekonekte</button>
  </div>
</header>
<main>
  <section id="login" class="kat" hidden>
    <div class="logo" style="background:var(--pri);margin-bottom:14px;width:46px;height:46px"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg></div>
    <h2>Konekte</h2><div class="note" style="margin:-4px 0 14px">Admin oswa manadjè sèlman.</div>
    <form id="fLogin" class="row">
      <label>Telefòn oswa imèl<input name="email" type="text" inputmode="text" required autocomplete="username" placeholder="ex: 3700 0000"></label>
      <label>Modpas<input name="pw" type="password" required autocomplete="current-password"></label>
      <button class="pri">Konekte</button>
    </form>
    <div id="loginErr"></div>
  </section>

  <section id="app" hidden>
    <div class="kat noprint">
      <div class="filt">
        <div class="gwoup">
          <label>Soti<input type="date" id="deb"></label>
          <label>Rive<input type="date" id="fen"></label>
          <div class="chips"><button data-p="jodi">Jodi a</button><button data-p="yè">Yè</button><button data-p="sem">7 jou</button><button data-p="mwa">Mwa sa a</button></div>
        </div>
        <div class="gwoup" style="align-items:center">
          <label class="swich"><input type="checkbox" id="gwoupe" checked>A1-/Succu- ansanm ak ajan an</label>
          <button class="pri" id="chaje">Chaje</button>
        </div>
      </div>
      <div class="prog" id="prog" hidden><div></div></div>
      <div id="eta" class="note"></div>
      <div id="erè"></div>
    </div>

    <div class="tabs noprint" id="tabs">
      <button data-t="jeneral" class="on">Rezime</button>
      <button data-t="ajan">Pa ajan</button>
      <button data-t="jou">Pa jou</button>
      <button data-t="kont">Balans kont</button>
      <button data-t="sispe">Erè sezi</button>
      <button data-t="sync">⇄ Synchro</button>
      <button data-t="koresp">Ajan</button>
      <span class="aksyon"><button id="csv">⤓ CSV</button><button id="enprime">⎙ Enprime</button></span>
    </div>
    <div id="vi"></div>
  </section>
</main>

<dialog id="mod"><div class="mod-tet"><span class="mod-ik in" id="modIk">i</span><h2 id="modT"></h2></div>
  <div class="mod-ko"><div id="modM"></div><div id="modD"></div><textarea id="modTx" hidden></textarea><div id="modE" class="err" hidden></div></div>
  <div class="mod-pye"><button id="modAn">Anile</button><button class="pri" id="modOk">OK</button></div></dialog>
<dialog id="dlg"><div class="tet"><h2 id="dlgT"></h2><button id="dlgF">Fèmen</button></div><div class="ko" id="dlgK"></div></dialog>

<script>
(function () {
  const ENV = {
    tes:  { url: "https://riutfmqffpffniutbhue.supabase.co", key: "sb_publishable_p8aTqDgmHm7XvpkEjk7LiQ_X5QgwbfZ" },
    prod: { url: "https://fdsuyqbscrnityotpmbc.supabase.co", key: "sb_publishable_a6JkadFn9ctIdCw7kBTPPw_7guHvavF" },
  };
  // Rubrik yo, nan lòd finans
  const RUB = [
    ["depot", "Depo"], ["retrait", "Retrè"], ["grandon", "Grandon (net)"], ["inscription", "Inscription"],
    ["renouvellement", "Renouvellement"], ["nouveau_carnet", "Nouveau Carnet (kanè pèdi)"], ["frais_service", "Nouveau Frais (frè sèvis prepeye)"], ["frais_auto", "Frais Auto (ansyen kont)"],
    ["frais", "Lòt frè"], ["virement", "Virement"], ["retour", "Retour"], ["credit", "Kredi"], ["konfyans", "Kredi Konfyans"],
    ["electromenager", "Kredi Electromenager"], ["debloke", "Kredi Debloke"], ["fdk", "FDK-Konfyans"],
    ["fonds_garantie", "Fonds Garantie"], ["monnaie", "Monnaie"], ["remise", "Remise"], ["dossier", "Dossier"], ["penalites", "Penalites"],
    ["solde", "Soldes cumulés"], ["versement", "Versements cumulés"],
  ];
  const RUB_L = Object.fromEntries(RUB);
  // Rubrik Supabase konnen (lòt yo pa sou app la : nou pa konpare yo ak Supabase)
  const RUB_SB = new Set(["depot", "retrait", "grandon", "inscription", "nouveau_carnet", "frais_service", "frais_auto", "frais", "virement", "solde"]);

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nf = (v) => (v === null || v === undefined ? "—" : Math.round(v).toLocaleString("fr-FR").replace(/ /g, " "));
  const fd = (s) => (s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "");
  const jouAyiti = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Port-au-Prince" }).format(new Date());
  const addJ = (s, n) => { const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const jouLis = (a, b) => { const o = []; for (let d = a; d <= b; d = addJ(d, 1)) o.push(d); return o; };
  const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 -]/g, " ").replace(/\s+/g, " ").trim();
  // Menm règ ak aplikasyon an : telefòn 8 chif → 509XXXXXXXX@ajan.grandon.invalid ; imèl la rete jan l ye
  const telefon8 = (t) => { let d = String(t || "").replace(/\D/g, ""); if (d.length === 11 && d.startsWith("509")) d = d.slice(3); return /^\d{8}$/.test(d) ? d : null; };
  const idanEmail = (ident) => { const s = String(ident || "").trim(); if (s.includes("@")) return /^[^@\s]+@[^@\s]+$/.test(s) ? s.toLowerCase() : null; const t = telefon8(s); return t ? `509${t}@ajan.grandon.invalid` : null; };
  const prefiks = (s) => String(s ?? "").trim().replace(/^(a1|succu)\s*-\s*/i, "").trim();

  let envK = "prod"; // vèsyon pwodiksyon : baz pwodiksyon sèlman
  $("env").value = envK;
  let sb = null, sess = null;
  const st = { done: null, imp: {}, err: [], tab: "jeneral", rubAjan: "depot", ajanSel: null };

  function kreyeKlyan() {
    sb = supabase.createClient(ENV[envK].url, ENV[envK].key, { auth: { storageKey: "rapw-" + envK } });
    $("envChip").textContent = envK === "prod" ? "PWODIKSYON" : "TÈS";
    $("envChip").className = "env " + (envK === "prod" ? "prod" : "tes");
  }
  // Sonje dènye chaj la (Chrome ka rechaje paj la lè w soti nan onglè a) : sessionStorage, pou baz sa a sèlman
  const KLE_SOVE = () => "rapw_eta_" + envK;
  function sove() {
    try { sessionStorage.setItem(KLE_SOVE(), JSON.stringify({ deb: $("deb").value, fen: $("fen").value, gwoupe: $("gwoupe").checked,
      done: st.done, imp: st.imp, err: st.err, tab: st.tab, rubAjan: st.rubAjan, lè: Date.now() })); } catch (_) {}
  }
  function restore() {
    try {
      const x = JSON.parse(sessionStorage.getItem(KLE_SOVE()) || "null");
      if (!x || Date.now() - x.lè > 12 * 3600e3) return false;
      $("deb").value = x.deb; $("fen").value = x.fen; $("gwoupe").checked = x.gwoupe !== false;
      st.done = x.done; st.imp = x.imp || {}; st.err = x.err || []; st.tab = x.tab || "jeneral"; st.rubAjan = x.rubAjan || "depot";
      $("eta").textContent = st.done ? `Chaje : ${fd(x.deb)} → ${fd(x.fen)} (sonje depi ${new Date(x.lè).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })} · klike « Chaje » pou mete l ajou)` : "";
      return true;
    } catch (_) { return false; }
  }
  async function kòmanse() {
    kreyeKlyan();
    const { data } = await sb.auth.getSession();
    sess = data.session;
    afiche();
    if (sess && restore()) rann();
  }
  function afiche() {
    $("login").hidden = !!sess; $("app").hidden = !sess; $("soti").hidden = !sess;
    $("moun").textContent = sess ? (sess.user.email || "").replace(/^509(\d{8})@ajan\.grandon\.invalid$/, "$1") : "";

  $("env").onchange = async () => {

  $("soti").onclick = async () => { await sb.auth.signOut(); sess = null; afiche(); };

  // Peryòd
  const jodi = jouAyiti();

  }));

  async function fn(body) {
    const { data: s } = await sb.auth.getSession();

    const r = await fetch(ENV[envK].url + "/functions/v1/rapwochman-bso", {
      method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.session.access_token, apikey: ENV[envK].key },
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({ error: "Repons envalid (" + r.status + ")" }));
    if (!r.ok || j.error) throw new Error(j.error || "Erè " + r.status);
    return j;
  }
  async function fnReseye(body, n = 3) {
    for (let i = 0; ; i++) {
      try { return await fn(body); } catch (e) {
        if (i >= n - 1 || /Aksè|konekte|Sekrè/.test(e.message)) throw e;
        await new Promise((r) => setTimeout(r, 1500 * (i + 1)));

    }
  }

  $("chaje").onclick = async () => {
    const deb = $("deb").value, fen = $("fen").value;

    if (jous.length > 31) return mesaj("Peryòd la twò long", "Ou ka chaje maksimòm <b>31 jou</b> alafwa.");

  // ---------- Kalkil ----------
  function kleKolekte(nomAt) { return $("gwoupe").checked ? prefiks(nomAt) : String(nomAt).trim(); }
  // Itilizatè Supabase → kle kolektè (non Airtable)
  function mapAjan(kles) {
    const m = {}, D = st.done;
    const man = {};
    for (const x of D.map || []) man[x.u] = kleKolekte(x.a);
    const kn = kles.map((k) => ({ k, w: norm(k).split(" ").filter(Boolean) }));
    for (const a of D.ajan || []) {
      if (man[a.u]) { m[a.u] = man[a.u]; continue; }
      const w = new Set(norm(a.non).split(" "));
      const bon = kn.filter((x) => x.w.length && x.w.every((t) => w.has(t))).sort((p, q) => q.w.length - p.w.length)[0];
      m[a.u] = bon ? bon.k : a.non || a.u.slice(0, 8);
    }
    return m;
  }
  function kalkile() {
    const D = st.done; if (!D) return null;
    const atant = true;
    // A[jou][kolektè][rub] = {s, sa, i, ni, d}
    const A = {};
    const cel = (j, k, r) => (((A[j] = A[j] || {})[k] = A[j][k] || {})[r] = A[j][k][r] || { s: 0, sa: 0, ns: 0, i: 0, ni: 0, d: 0, nd: 0, x: 0, nx: 0, xs: 0 });
    const kles = new Set();
    for (const [j, x] of Object.entries(st.imp)) {
      for (const k of Object.keys(x.imp || {})) kles.add(kleKolekte(k));
      for (const k of Object.keys(x.dec || {})) kles.add(kleKolekte(k));
    }
    const um = mapAjan([...kles]);
    const sbKolekte = new Set();
    for (const t of D.tx || []) {
      const k = um[t.u] || "(san ajan)"; sbKolekte.add(k);
      const c = cel(t.j, k, t.r);
      if (t.s === "pending") { c.sa += t.m; if (atant) c.ns += t.n; }
      else { c.s += t.m; c.ns += t.n; }
    }
    const meta = {};
    for (const [j, x] of Object.entries(st.imp)) {
      for (const [kA, rubs] of Object.entries(x.imp || {})) {
        const k = kleKolekte(kA);
        for (const [r, v] of Object.entries(rubs)) { const c = cel(j, k, r); c.i += v.m; c.ni += v.n; }
        for (const [r, v] of Object.entries((x.imp_doub || {})[kA] || {})) { const c = cel(j, k, r); c.x += v.m; c.nx += v.n; c.xs += v.ms || 0; }
        const mm = ((meta[j] = meta[j] || {})[k] = meta[j][k] || { non: new Set(), err: 0, rapo: 0, cash: 0, encaisse: 0, doublon: 0 });
        mm.non.add(kA); mm.err += (x.imp_erronees || {})[kA] || 0;
      }
      for (const [kA, rubs] of Object.entries(x.dec || {})) {
        const k = kleKolekte(kA);
        const mm = ((meta[j] = meta[j] || {})[k] = meta[j][k] || { non: new Set(), err: 0, rapo: 0, cash: 0, encaisse: 0, doublon: 0 });
        mm.non.add(kA); mm.rapo += rubs._rapo || 0; mm.cash += rubs._cash || 0; mm.encaisse += rubs._encaisse || 0; mm.doublon += rubs._doublon || 0;
        for (const [r, v] of Object.entries(rubs)) if (!r.startsWith("_")) { const c = cel(j, k, r); c.d += v; c.nd++; }
      }
    }
    return { A, meta, um, sbKolekte, atant, jous: Object.keys(st.imp).sort() };
  }
  // Data Importe = Supabase valide + Supabase an atant + Importation Globale ; se li ki konpare ak Declaration Agent
  const imp = (c) => c.s + c.sa + c.i;
  const doub = (c) => !!c.x; // liy Importation ki deja sou app la (menm kont + rubrik + montan, menm jou)
  function sòm(list) {
    const o = { s: 0, sa: 0, ns: 0, i: 0, ni: 0, d: 0, nd: 0, x: 0, nx: 0, xs: 0 };
    for (const c of list) if (c) for (const k in o) o[k] += c[k] || 0;
    return o;
  }

  // ---------- Afichaj ----------
  function ekarCel(a, b) {
    const d = Math.round(a - b);
    return d === 0 ? `<td class="okc">0</td>` : `<td class="ekar">${d > 0 ? "+" : ""}${nf(d)}</td>`;
  }
  function rann() {
    document.querySelectorAll("#tabs [data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === st.tab));
    if (st.tab === "sync") return vSync();
    if (st.tab === "kont") return vKont();
    if (st.tab === "sispe") return vSispe();
    const K = kalkile();
    if (!K) { $("vi").innerHTML = `<div class="kat vid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><div><b>Chwazi yon peryòd</b>, epi klike « Chaje ».</div></div>`; return; }
    st.K = K;
    ({ jeneral: vJeneral, ajan: vAjan, jou: vJou, koresp: vKoresp })[st.tab](K);
  }
  function antet(prem = "") {
    return `<tr><th>${prem}</th><th title="Tranzaksyon Kès valide sou Supabase">Supabase valide</th><th title="Depo sou Supabase Kès poko valide">Supabase an atant</th>
      <th>Importation Globale</th><th class="imp" title="Supabase valide + Supabase an atant + Importation Globale">Data Importe</th>
      <th>Declaration Agent</th><th title="Data Importe − Declaration Agent">Ekar</th></tr>`;
  }
  function liy(lab, c, r, atr = "") {
    const sbOk = RUB_SB.has(r);
    return `<tr ${atr}><td>${lab}</td><td>${sbOk ? nf(c.s) : '<span class="na">—</span>'}</td><td>${sbOk ? nf(c.sa) : '<span class="na">—</span>'}</td>
      <td>${nf(c.i)}</td><td class="imp">${nf(imp(c))}</td><td>${nf(c.d)}</td>${ekarCel(imp(c), c.d)}</tr>`;
  }
  // Pou chak kolektè : kantite (jou × rubrik) kote li parèt nan Supabase AK nan Importation (posib doub)
  function doubAjan(K, k, r) {
    let n = 0;
    for (const j of Object.keys(K.A)) for (const [rr, c] of Object.entries(K.A[j][k] || {})) if ((!r || rr === r) && doub(c)) n++;
    return n;
  }
  function vJeneral(K) {
    const rows = RUB.map(([r, l]) => {
      const all = [];
      for (const j of Object.keys(K.A)) for (const rr of Object.values(K.A[j])) if (rr[r]) all.push(rr[r]);
      const t = sòm(all);
      return { r, l, t, vid: !t.s && !t.sa && !t.i && !t.d };
    }).filter((x) => !x.vid);
    // KPI anwo paj la
    const nOk = rows.filter((x) => Math.round(imp(x.t) - x.t.d) === 0).length;
    const ajEk = new Set(), ajSan = new Set(); let nDoub = 0, nPos = 0;
    for (const [r] of RUB) { const T = totAjan(K, r); for (const [k, c] of Object.entries(T)) if (Math.round(imp(c) - c.d) !== 0) ajEk.add(k); }
    for (const j of Object.keys(K.A)) for (const [k, rr] of Object.entries(K.A[j])) for (const c of Object.values(rr)) { nDoub += c.xs || 0; nPos += (c.x || 0) - (c.xs || 0); }
    for (const [j, m] of Object.entries(K.meta)) for (const [k, x] of Object.entries(m)) if (x && !x.rapo) ajSan.add(k);
    const vers = rows.find((x) => x.r === "versement");
    let h = `<div class="kpi">
      <div class="k ${nOk === rows.length ? "ok" : "er"}"><div class="l">Rubrik balanse</div><div class="v">${nOk} / ${rows.length}</div><div class="s">${rows.length - nOk ? `${rows.length - nOk} rubrik gen ekar` : "Tout bagay balanse"}</div></div>
      <div class="k ${ajEk.size ? "er" : "ok"}"><div class="l">Ajan ki gen ekar</div><div class="v">${ajEk.size}</div><div class="s">${ajEk.size ? "Klike « Pa ajan » pou detay" : "Okenn ekar"}</div></div>
      <div class="k ${nDoub ? "er" : nPos ? "av" : "ok"}"><div class="l">Montan an doub</div><div class="v">${nf(nDoub)}</div><div class="s">${nPos ? `+ ${nf(nPos)} posib doub` : "Okenn posib doub"}</div></div>
      ${vers ? `<div class="k ak"><div class="l">Versement · Data Importe</div><div class="v">${nf(imp(vers.t))}</div><div class="s">Declaration : ${nf(vers.t.d)}</div></div>` : `<div class="k ${ajSan.size ? "av" : "ok"}"><div class="l">Ajan san rapò</div><div class="v">${ajSan.size}</div><div class="s">Pa nan Declaration Agent</div></div>`}
    </div>`;
    h += `<div class="kat"><h2>Total jeneral · tout ajan</h2><div class="wrap"><table>${antet("Rubrik")}`;
    for (const x of rows) h += liy(esc(x.l), x.t, x.r, `class="klik" data-rub="${x.r}"`);
    h += `</table></div><div class="note"><b>Data Importe</b> = Supabase valide + Supabase an atant + Importation Globale. <b>Ekar</b> = Data Importe − Declaration Agent.
      Siy <span class="chip er">doub</span> la parèt lè yon liy nan Importation Globale deja sou app la (menm kont, menm rubrik, menm montan, menm jou).
      Kopi istorik Airtable ki te enpòte sou Supabase yo pa konte bò Supabase (yo deja nan Importation Globale). Klike sou yon rubrik pou wè l pa ajan.</div></div>`;
    $("vi").innerHTML = h;
    $("vi").querySelectorAll("[data-rub]").forEach((tr) => (tr.onclick = () => { st.rubAjan = tr.dataset.rub; st.tab = "ajan"; rann(); }));
  }
  function totAjan(K, r) {
    const T = {};
    for (const j of Object.keys(K.A)) for (const [k, rr] of Object.entries(K.A[j])) {
      const o = (T[k] = T[k] || sòm([]));
      const v = rr[r]; if (v) for (const z in o) o[z] += v[z] || 0;
    }
    return T;
  }
  function chipsAjan(K, k, r, c) {
    const m = Object.values(K.meta).map((x) => x[k]).filter(Boolean);
    const err = m.reduce((a, x) => a + x.err, 0), dbl = m.reduce((a, x) => a + x.doublon, 0), rapo = m.reduce((a, x) => a + x.rapo, 0);
    const tx = (f) => Object.keys(K.A).reduce((a, j) => a + (r ? (K.A[j][k]?.[r]?.[f] || 0) : Object.values(K.A[j][k] || {}).reduce((b, c) => b + (c[f] || 0), 0)), 0);
    const nd = tx("xs"), np = tx("x") - nd;
    return (K.sbKolekte.has(k) ? ` <span class="chip ok">app</span>` : "")
      + (nd ? ` <span class="chip er" title="Liy nan Importation Globale ki deja sou app la : menm kont, rubrik, montan, jou EPI menm solde. Yo konte 2 fwa nan Data Importe.">doub ${nf(nd)}</span>` : "")
      + (np ? ` <span class="chip av" title="Menm kont, rubrik, montan, jou ak yon tranzaksyon app la, men solde a diferan (oswa li manke) : verifye.">posib doub ${nf(np)}</span>` : "")
      + (err ? ` <span class="chip er" title="Liy make Erronees nan Importation">${err} erè</span>` : "")
      + (dbl ? ` <span class="chip av" title="Rapò make Doublon">${dbl} doublon</span>` : "")
      + (!rapo && imp(c) ? ` <span class="chip av" title="Pa gen rapò nan Declaration Agent">san rapò</span>` : "");
  }
  function vAjan(K) {
    const r = st.rubAjan, T = totAjan(K, r);
    const ks = Object.keys(T).filter((k) => T[k].s || T[k].sa || T[k].i || T[k].d).sort((a, b) => a.localeCompare(b));
    const opt = RUB.map(([x, l]) => `<option value="${x}" ${x === r ? "selected" : ""}>${esc(l)}</option>`).join("");
    let h = `<div class="kat"><div class="row" style="justify-content:space-between"><h2>Pa ajan · ${esc(RUB_L[r])}</h2>
      <label class="noprint">Rubrik<select id="rubSel">${opt}</select></label></div><div class="wrap"><table>${antet("Ajan")}`;
    const tot = sòm([]);
    for (const k of ks) {
      const c = T[k]; for (const z in tot) tot[z] += c[z];
      h += liy(esc(k) + chipsAjan(K, k, r, c), c, r, `class="klik" data-k="${esc(k)}"`);
    }
    h += liy("TOTAL", tot, r, 'class="tot"');

    $("vi").innerHTML = h;
    $("rubSel").onchange = (e) => { st.rubAjan = e.target.value; rann(); sove(); };
    $("vi").querySelectorAll("[data-k]").forEach((tr) => (tr.onclick = () => ouvriAjan(tr.dataset.k)));
  }
  function vJou(K) {

    const opt = RUB.map(([x, l]) => `<option value="${x}" ${x === r ? "selected" : ""}>${esc(l)}</option>`).join("");
    let h = `<div class="kat"><div class="row" style="justify-content:space-between"><h2>Pa jou · ${esc(RUB_L[r])} · tout ajan</h2>

  }
  function vKoresp(K) {

    for (const a of ajan) h += `<tr><td>${esc(a.non)}</td><td>${esc(K.um[a.u] || "")}</td><td><select data-u="${a.u}" data-old="${esc(man[a.u] || "")}">${opt(man[a.u] || "")}</select></td></tr>`;
    h += `</table></div><div class="note">Sistèm nan rekonèt ajan an otomatikman lè non Airtable la (san A1-/Succu-) parèt nan non Supabase la. Si li pa bon, chwazi non an alamen.</div></div>`;
    $("vi").innerHTML = h;
    $("vi").querySelectorAll("select[data-u]").forEach((s) => (s.onchange = async () => {
      const { error } = await sb.rpc("rapw_ajan_konekte", { p_user: s.dataset.u, p_nom: s.value || null });

  // ---------- Fenèt konfimasyon / mesaj (ranplase confirm, alert, prompt) ----------
  // modal({ tit, mesaj, detay (html), kalite: "in"|"ok"|"av"|"er", ok, anile (false = pa gen bouton anile), danje, antre: { plas, obligatwa } })
  function modal(o) {
    return new Promise((rezoud) => {
      const d = $("mod"), tx = $("modTx");
      const ik = { in: "i", ok: "✓", av: "!", er: "×" }[o.kalite || "in"];
      $("modIk").className = "mod-ik " + (o.kalite || "in"); $("modIk").textContent = ik;
      $("modT").textContent = o.tit || "";
      $("modM").innerHTML = o.mesaj || ""; $("modD").innerHTML = o.detay || "";
      tx.hidden = !o.antre; tx.value = ""; tx.placeholder = o.antre?.plas || "";
      $("modE").hidden = true;
      $("modOk").textContent = o.ok || "OK"; $("modOk").className = o.danje ? "danje" : "pri";
      $("modAn").hidden = o.anile === false; $("modAn").textContent = o.anile || "Anile";
      const fini = (rep) => { d.close(); $("modOk").onclick = $("modAn").onclick = d.oncancel = null; rezoud(rep); };
      $("modOk").onclick = () => {
        if (o.antre?.obligatwa && tx.value.trim().length < 3) { $("modE").textContent = "Ekri yon rezon (omwen 3 lèt)."; $("modE").hidden = false; tx.focus(); return; }
        fini({ ok: true, tèks: tx.value.trim() });
      };
      $("modAn").onclick = () => fini({ ok: false });
      d.oncancel = (e) => { e.preventDefault(); fini({ ok: false }); };
      d.showModal();
      (o.antre ? tx : $("modOk")).focus();
    });
  }
  const mesaj = (tit, txt, kalite = "av") => modal({ tit, mesaj: txt, kalite, anile: false });
  // Rezime rezilta yon aksyon (OK / erè)
  function rezilta(tit, lis) {
    const ok = lis.filter((r) => r.ok), er = lis.filter((r) => !r.ok);

  // ================= Onglè 2 : Synchro Supabase ↔ baz Airtable mwa yo =================
  // ================= Balans pa kont : Supabase ↔ Airtable « Compte Epargne » =================
  const KB = { data: null, filt: "ekar", q: "", lè: null };
  async function chajeKont() {
    $("kbEta").innerHTML = `<div class="note">Ap li balans Supabase ak Airtable yo… (kèk segonn)</div>`;
    try {
      const [s, a] = await Promise.all([sb.rpc("rapw_kont_balans"), fnReseye({ aksyon: "kont" })]);
      if (s.error) throw new Error(s.error.message);
      const M = new Map();
      for (const x of s.data || []) M.set(x.kod, { kod: x.kod, sb: x });
      for (const x of a.kont || []) { if (!x.kod) continue; const o = M.get(x.kod) || { kod: x.kod }; o.at = x; M.set(x.kod, o); }
      const lis = [];
      for (const o of M.values()) {
        if (!o.sb && (!o.at || !o.at.solde)) continue; // kont Airtable vid ki pa sou Supabase : pa enpòtan
        o.ref = o.sb ? o.sb.solde - o.sb.pa_voye : null;
        o.ekar = o.sb && o.at && o.at.solde !== null ? Math.round(o.at.solde - o.ref) : null;
        o.eta = !o.sb ? "pa_sb" : !o.at ? "pa_at" : o.ekar === 0 ? "ok" : "ekar";
        lis.push(o);
      }
      KB.data = { lis, koupe: a.koupe }; KB.lè = new Date().toLocaleTimeString("fr-FR");
    } catch (e) { $("kbEta").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    rannKont();
  }

      <b>Ekar</b> = Airtable − (Supabase valide − valide poko voye). Ekar pozitif : Airtable gen plis (liy Importation ki pa sou Supabase, oswa doub nan Airtable). Ekar negatif : Supabase gen plis.</div>

    const q = KB.q.trim().toLowerCase();

          <td>${s && s.n_pa_voye ? `${nf(s.pa_voye)} <span class="mut">(${s.n_pa_voye})</span>` : s ? "0" : '<span class="na">—</span>'}</td><td class="imp">${s ? nf(o.ref) : '<span class="na">—</span>'}</td>
          <td>${a && a.solde !== null ? nf(a.solde) : '<span class="na">—</span>'}</td>${ek}<td>${s?.denye ? fd(s.denye) : ""}</td></tr>`; }).join("")}</table></div>`
      : `<div class="note okc">Okenn kont nan filt sa a.</div>`;
    $("kbV").innerHTML = h + `</div>`;

  async function fnSync(body) {
    const { data: s } = await sb.auth.getSession();
    if (!s.session) throw new Error("Sesyon an fini : konekte ankò");
    const r = await fetch(ENV[envK].url + "/functions/v1/rapwochman-sync", {
      method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.session.access_token, apikey: ENV[envK].key },
      body: JSON.stringify(body),
    });
    const j = await r.json().catch(() => ({ error: "Repons envalid (" + r.status + ")" }));
    if (!r.ok || j.error) throw new Error(j.error || "Erè " + r.status);
    return j;
  }
  const SY = { sb: null, at: null, log: [] };
  const TIP_L = { D: "Depo", R: "Retrè", FL: "Frè", FA: "Frais Auto", V: "Virement" };
  const ST_AT = {
    nouvo: ["Nouvo", "av"], deja: ["Deja sou Supabase", "ok"], lye: ["Deja trete", "ok"], rejte: ["Rejte", "er"],
    kont_manke: ["Kont pa sou Supabase", "er"], pa_sipote: ["Pa sipòte", "er"],
  };
  function jounal(lis) {
    SY.log = [...lis.map((r) => ({ ...r, lè: new Date().toLocaleTimeString("fr-FR") })), ...SY.log].slice(0, 300);
  }
  function vSync() {
    const deb = $("deb").value, fen = $("fen").value;
    let h = `<div class="kat"><h2>Synchro Supabase ↔ baz Airtable mwa yo</h2>
      <div class="note">Peryòd : ${fd(deb)} → ${fd(fen)} (chanje l anlè a). Synchro a kòmanse 11/11/2026. Tranzaksyon Supabase yo ale nan Airtable sèlman lè Kès la valide yo.

    h += `<div class="kat"><div class="row" style="justify-content:space-between"><h2>1 · Supabase → Airtable</h2>

  async function chercheSb() {
    $("syA").innerHTML = `<div class="note">Ap chèche…</div>`;

  function rannAt() {
    const ops = SY.at.ops || [];
    const gwoup = {}; for (const o of ops) (gwoup[o.statut] ||= []).push(o);
    const kle = (o) => `${o.base}|${o.rec}|${o.kolon}`;
    SY.atMap = Object.fromEntries(ops.map((o) => [kle(o), o]));
    let h = `<div class="note">${ops.length} operasyon nan ${new Set(ops.map((o) => o.rec)).size} liy Airtable (${fd(SY.at.deb)} → ${fd(SY.at.fen)}) · ` +
      Object.entries(ST_AT).map(([k, [l]]) => `${l} : ${(gwoup[k] || []).length}`).join(" · ") + `</div>`;
    if ((SY.at.erè || []).length) h += `<div class="err">${esc(SY.at.erè.join("\n"))}</div>`;
    if (SY.at.koupe) h += `<div class="err">Twòp liy : lis la koupe. Chwazi yon peryòd pi kout.</div>`;
    const tab = (lis, chk) => `<div class="wrap"><table><tr>${chk ? "<th></th>" : ""}<th>Dat</th><th>Kont</th><th>Kliyan</th><th>Kolòn</th><th>Montan</th><th>Solde Airtable</th><th>Kolektè</th></tr>${lis.map((o) =>
      `<tr>${chk ? `<td><input type="checkbox" class="atC" value="${esc(kle(o))}"></td>` : ""}<td>${fd(o.jou)}</td><td>${esc(o.kod)}</td><td style="text-align:left">${esc(o.non || "")}</td><td style="text-align:left">${esc(o.kolon)}${o.alet ? ' <span class="chip av">alèt</span>' : ""}</td><td>${nf(o.m)}</td><td>${nf(o.solde)}</td><td style="text-align:left">${esc(o.kolekte)}</td></tr>`).join("")}</table></div>`;
    const nouvo = gwoup.nouvo || [];
    const depo = nouvo.filter((o) => !o.alet), alet = nouvo.filter((o) => o.alet);
    h += `<h2 style="margin-top:12px">Depo pou antre sou Supabase (${depo.length})</h2><div class="note">Yo ap antre <b>an atant</b> : Kès la ap valide yo.</div>`;
    h += depo.length ? tab(depo, true) + `<div class="row noprint" style="margin-top:6px"><button class="pri" data-ak="enpote" data-gr="d">Enpote sa ki chwazi yo</button><button data-ak="rejte" data-gr="d">Rejte</button></div>` : `<div class="note okc">Okenn</div>`;
    h += `<h2 style="margin-top:12px">Alèt : bezwen apwouve (${alet.length})</h2><div class="note">Retrè, frè ak Grandon ki pase pa Airtable. Verifye yo anvan : yo antre <b>konfime</b> sou Supabase (depo Grandon an atant).</div>`;
    h += alet.length ? tab(alet, true) + `<div class="row noprint" style="margin-top:6px"><button class="pri" data-ak="apwouve" data-gr="a">Apwouve epi enpote</button><button data-ak="rejte" data-gr="a">Rejte</button></div>` : `<div class="note okc">Okenn</div>`;
    const deja = gwoup.deja || [];
    h += `<h2 style="margin-top:12px">Deja sou Supabase (${deja.length})</h2><div class="note">Menm kont, kolòn, montan, jou : se menm tranzaksyon an. Konekte yo pou yo pa parèt ankò (pa gen anyen ki kreye).</div>`;
    h += deja.length ? tab(deja, true) + `<div class="row noprint" style="margin-top:6px"><button data-ak="konekte" data-gr="k">Konekte sa ki chwazi yo</button></div>` : `<div class="note okc">Okenn</div>`;
    for (const k of ["kont_manke", "pa_sipote"]) {
      const l = gwoup[k] || [];
      if (l.length) h += `<h2 style="margin-top:12px">${ST_AT[k][0]} (${l.length})</h2><div class="note">${k === "kont_manke" ? "Kont sa yo pa sou Supabase : tranzaksyon yo rete nan Airtable sèlman." : "Kolòn sa yo (Virement, Retour) dwe trete alamen."}</div>` + tab(l, false);
    }
    const tr = (gwoup.lye || []).length + (gwoup.rejte || []).length;
    if (tr) h += `<div class="note" style="margin-top:10px">${tr} operasyon deja trete (enpote, konekte oswa rejte) pa parèt anlè a.</div>`;
    $("syB").innerHTML = h;
    // Chak seksyon gen pwòp kaz li : bouton an pran sa ki chwazi nan menm seksyon an
    $("syB").querySelectorAll("button[data-ak]").forEach((b) => (b.onclick = () => aksyonAt(b)));
  }
  async function aksyonAt(b) {
    const blok = b.parentElement.previousElementSibling;
    const chwa = [...blok.querySelectorAll(".atC:checked")].map((c) => SY.atMap[c.value]).filter(Boolean);
    if (!chwa.length) return mesaj("Pa gen anyen chwazi", "Make omwen yon liy anvan.", "in");
    const ak = b.dataset.ak;
    let rezon = "";
    const lisH = `<div class="lis"><table><tr><th>Dat</th><th>Kont</th><th>Kolòn</th><th>Montan</th><th>Kolektè</th></tr>${chwa.map((o) => `<tr><td>${fd(o.jou)}</td><td>${esc(o.kod)}</td><td style="text-align:left">${esc(o.kolon)}</td><td>${nf(o.m)}</td><td style="text-align:left">${esc(o.kolekte)}</td></tr>`).join("")}</table></div>`;
    const tot = `<div class="mod-tot"><span>${chwa.length} operasyon · ${nf(chwa.reduce((a, o) => a + o.m, 0))} G</span></div>`;
    const TX = {
      enpote: { tit: `Enpote ${chwa.length} depo sou Supabase ?`, kalite: "in", ok: "Wi, enpote", mesaj: "Depo sa yo ap antre sou Supabase <b>an atant</b> : Kès la ap valide yo." + tot },
      apwouve: { tit: `Apwouve ${chwa.length} alèt ?`, kalite: "av", ok: "Wi, mwen verifye yo · apwouve", mesaj: "Operasyon sa yo (retrè, frè, Grandon) pase pa Airtable. Lè w apwouve yo, yo antre sou Supabase <b>touswit</b> (depo Grandon an atant pou Kès). Asire w ou verifye yo." + tot },
      konekte: { tit: `Konekte ${chwa.length} liy ?`, kalite: "in", ok: "Wi, konekte", mesaj: "Liy Airtable sa yo se menm tranzaksyon ak sa ki deja sou Supabase. Pa gen anyen ki ap kreye : yo jis p ap parèt ankò." + tot },
      rejte: { tit: `Rejte ${chwa.length} operasyon ?`, kalite: "er", ok: "Rejte", danje: true, antre: { plas: "Poukisa ? (ex: erè ekip data, doub…)", obligatwa: true },
        mesaj: "Operasyon sa yo p ap janm antre sou Supabase. Ekri rezon an :" + tot },
    }[ak];
    const r0 = await modal({ ...TX, detay: lisH });
    if (!r0.ok) return;
    if (ak === "rejte") rezon = r0.tèks;
    b.disabled = true;
    const body = { aksyon: ak === "apwouve" ? "enpote" : ak, apwouve: ak === "apwouve", rezon,
      ops: chwa.map((o) => ({ base: o.base, rec: o.rec, kolon: o.kolon, tx: o.tx, kod: o.kod })) };
    for (let i = 0; i < body.ops.length; i += 40) {
      try { const r = await fnSync({ ...body, ops: body.ops.slice(i, i + 40) }); jounal(r.detay || []); }
      catch (e) { jounal([{ ok: false, mesaj: e.message }]); break; }
    }
    $("syLog").innerHTML = logHtml();
    await rezilta({ enpote: "Rezilta enpòtasyon an", apwouve: "Rezilta apwobasyon an", konekte: "Rezilta koneksyon an", rejte: "Rezilta rejè a" }[ak], SY.log.slice(0, chwa.length));
    await liAt();
  }

  // ---------- Detay yon ajan ----------
  function ouvriAjan(k) {
    const K = st.K;
    const rubs = RUB.filter(([r]) => K.jous.some((j) => K.A[j]?.[k]?.[r]));
    let h = `<div class="wrap"><table><tr><th>Jou</th><th>Rubrik</th><th>Supabase valide</th><th>An atant</th><th>Importation</th><th class="imp">Data Importe</th><th>Declaration</th><th>Ekar</th><th></th></tr>`;
    for (const j of K.jous) for (const [r, l] of rubs) {
      const c = K.A[j]?.[k]?.[r]; if (!c) continue;
      const sk = RUB_SB.has(r);
      const bouton = sk && (doub(c) || Math.round(imp(c) - c.d)) ? `<button data-j="${j}">${doub(c) ? "Doub · wè liy yo" : "Wè liy yo"}</button>` : "";
      h += `<tr><td>${fd(j)}</td><td style="text-align:left">${esc(l)}</td><td>${sk ? nf(c.s) : "—"}</td><td>${sk ? nf(c.sa) : "—"}</td><td>${nf(c.i)}</td>
        <td class="imp">${nf(imp(c))}</td><td>${nf(c.d)}</td>${ekarCel(imp(c), c.d)}<td>${bouton}</td></tr>`;
    }
    h += `</table></div>`;
    const m = Object.entries(K.meta).map(([j, x]) => x[k] && `${fd(j)} : ${[...x[k].non].join(", ")}${x[k].rapo ? ` · Cash deklare ${nf(x[k].cash)} · Encaisse ${nf(x[k].encaisse)}` : " · pa gen rapò"}`).filter(Boolean);
    h += `<div class="note">${m.map(esc).join("<br>")}</div><div id="liyDet"></div>`;
    $("dlgT").textContent = k; $("dlgK").innerHTML = h; $("dlg").showModal();
    $("dlgK").querySelectorAll("[data-j]").forEach((b) => (b.onclick = () => liyYo(k, b.dataset.j)));
  }
  // Konpare liy pa liy (kont + rubrik + montan)
  async function liyYo(k, j) {
    const box = $("liyDet"); box.innerHTML = `<div class="note">Ap chaje liy yo…</div>`;
    try {
      const K = st.K;
      const uids = Object.entries(K.um).filter(([, v]) => v === k).map(([u]) => u);
      const nonAt = [...(K.meta[j]?.[k]?.non || [k])];
      const [s, a] = await Promise.all([sb.rpc("rapw_detay", { p_jou: j, p_uids: uids }), fnReseye({ aksyon: "detay", jou: j, kolekte: nonAt })]);
      if (s.error) throw new Error(s.error.message);
      const S = (s.data || []).filter((x) => RUB_SB.has(x.rub) && x.rub !== "solde")
        .map((x) => ({ kont: (x.kod || x.no_compte || "").trim(), rub: x.rub, m: x.rub === "grandon" && x.tip !== "D" ? -x.montan : x.montan, x }));
      const I = [], D = [];
      for (const l of a.liy) for (const [r, v] of Object.entries(l.v)) {
        if (!RUB_SB.has(r)) continue;
        const o = { kont: String(l.kont || "").trim(), rub: r, m: v, l };
        o.nivo = l.doub && l.doub[r] ? l.doub[r].nivo || "seten" : null;
        (o.nivo ? D : I).push(o);
      }
      const t = (lst) => lst.length ? `<div class="wrap lis2"><table><tr><th>Kont</th><th>Rubrik</th><th>Montan</th><th>Solde</th><th class="tl">Kliyan</th></tr>${lst.map((o) => `<tr><td>${esc(o.kont)}${o.nivo ? ` <span class="chip ${o.nivo === "seten" ? "er" : "av"}">${o.nivo === "seten" ? "doub" : "posib"}</span>` : ""}</td><td>${esc(RUB_L[o.rub] || o.rub)}</td><td>${nf(o.m)}</td><td>${o.x ? nf(o.x.solde) : nf(o.l.solde)}</td><td class="tl">${o.x ? esc(o.x.kliyan) + (o.x.st === "pending" ? ' <span class="chip av">an atant</span>' : "") : esc(o.l.non || "") + (o.l.erronees ? ' <span class="chip er">Erronees</span>' : "")}</td></tr>`).join("")}</table></div>` : `<div class="note okc">Okenn</div>`;
      const sòmM = (l) => nf(l.reduce((x, o) => x + o.m, 0));
      box.innerHTML = `<h2 style="margin-top:14px">Liy yo · ${fd(j)}</h2>
        <div class="kat" style="border-color:var(--er)"><h2 style="color:var(--er)">Doub : nan Importation Globale MEN deja sou app la (${D.length} · ${sòmM(D)} G)</h2>
          <div class="note">Menm kont, menm rubrik, menm montan, menm jou ak yon tranzaksyon Supabase (kèlkeswa ajan ki te antre l sou app la). <span class="chip er">doub</span> = solde a menm tou (sèten) · <span class="chip av">posib</span> = solde a diferan oswa li manke. Yo konte 2 fwa nan Data Importe.</div>${t(D)}</div>
        <div class="kol3"><div><h2 class="mut">Sou Supabase · ajan sa a (${S.length} · ${sòmM(S)} G)</h2>${t(S)}</div>
        <div><h2 class="mut">Nan Importation Globale · lòt liy (${I.length} · ${sòmM(I)} G)</h2>${t(I)}</div></div>
        ${a.koupe ? '<div class="err">Twòp liy : lis Importation an koupe.</div>' : ""}`;
    } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  }
  $("dlgF").onclick = () => $("dlg").close();

  // ---------- Onglè, CSV, enprime ----------
  document.querySelectorAll("#tabs [data-t]").forEach((b) => (b.onclick = () => { st.tab = b.dataset.t; rann(); sove(); }));
  $("gwoupe").onchange = rann;
  $("enprime").onclick = () => window.print();
  $("csv").onclick = () => {
    const t = $("vi").querySelector("table"); if (!t) return;
    const rows = [...$("vi").querySelectorAll("table")].flatMap((tb) => [...tb.rows].map((r) => [...r.cells].map((c) => '"' + c.innerText.replace(/"/g, '""').replace(/\s+/g, " ").trim() + '"').join(";")));
    const blob = new Blob(["﻿" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `rapwochman-${st.tab}-${$("deb").value}_${$("fen").value}.csv`; a.click();
  };

  kòmanse();
})();
</script>
</body>
</html>
