  <script>
    // Mete look/tèm/gwosè tèks la ANVAN premye randering lan (pa gen flach).
    try {
      var p = JSON.parse(localStorage.getItem("grandon-prefs") || "{}"), r = document.documentElement;
      r.dataset.look = ["a", "b", "c"].includes(p.look) ? p.look : "a";
      if (r.dataset.look === "c" || p.tem === "dark") r.dataset.theme = "dark"; else if (p.tem === "light") r.dataset.theme = "light";
      if (p.teks) r.dataset.teks = p.teks;
    } catch (e) {}
  </script>
