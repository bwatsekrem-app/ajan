<!doctype html>
<html lang="ht" data-look="a" data-mak="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#094368">
  <meta name="robots" content="noindex">
  <meta name="description" content="Bwat Sekrèm: kliyan, cycle epay ak depo, menm san entènèt.">
  <title>Bwat Sekrèm · TÈS</title>
  <script>
    // Mete look/tèm/gwosè tèks la ANVAN premye randering lan (pa gen flach).
    try {
      var p = JSON.parse(localStorage.getItem("grandon-prefs") || "{}"), r = document.documentElement;
      r.dataset.look = ["a", "b", "c"].includes(p.look) ? p.look : "a";
      if (r.dataset.look === "c" || p.tem === "dark") r.dataset.theme = "dark"; else if (p.tem === "light") r.dataset.theme = "light";
      if (p.teks) r.dataset.teks = p.teks;
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../app.css">
  <link rel="stylesheet" href="../look-a.css">
  <link rel="stylesheet" href="../look-b.css">
  <link rel="stylesheet" href="../look-c.css">
  <link rel="stylesheet" href="../mak.css">
  <style>
    /* Ekran chajman (anvan aplikasyon an parèt): logo a anime pandan l ap chaje. */
    .splash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(120% 90% at 50% 35%, #1d3866 0%, #14284b 55%, #0b1830 100%); color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .spl-logo { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .spl-mak { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 700; font-size: 2.6rem; letter-spacing: .08em; display: inline-flex; }
    .spl-mak span { display: inline-block; opacity: 0; transform: translateY(14px); animation: spl-let .7s cubic-bezier(.2, .8, .2, 1) forwards, spl-glo 2.4s ease-in-out 1.2s infinite; }
    .spl-ikon { width: 84px; height: 84px; animation: spl-pop .8s cubic-bezier(.2, .9, .3, 1.3) both, spl-flo 2.6s ease-in-out .8s infinite; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .25)); }
    .spl-bar { width: 132px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .16); overflow: hidden; position: relative; }
    .spl-bar i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 4px; background: #c9a227; animation: spl-bar 1.25s ease-in-out infinite; }
    .spl-t { margin: 0; font-size: .85rem; letter-spacing: .04em; opacity: .7; }
    html[data-mak="bs"] .splash { background: radial-gradient(120% 90% at 50% 35%, #0f5a88 0%, #094368 55%, #06304b 100%); }
    html[data-mak="bs"] .spl-mak { font-family: "Inter", "Segoe UI", system-ui, Arial, sans-serif; font-weight: 800; letter-spacing: 0; font-size: 2rem; }
    html[data-mak="bs"] .spl-bar i { background: #63b32e; }
    @keyframes spl-let { to { opacity: 1; transform: none; } }
    @keyframes spl-glo { 0%, 100% { text-shadow: none; } 50% { text-shadow: 0 0 18px rgba(255, 255, 255, .45); } }
    @keyframes spl-pop { from { opacity: 0; transform: scale(.6) rotate(-8deg); } to { opacity: 1; transform: none; } }
    @keyframes spl-flo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes spl-bar { 0% { left: -40%; } 100% { left: 100%; } }
    @media (prefers-reduced-motion: reduce) { .spl-mak span, .spl-ikon, .spl-bar i { animation: none; opacity: 1; transform: none; } .spl-bar i { left: 30%; } }
  </style>
</head>
<body>
  <header id="bar" hidden></header>
  <nav id="nav" class="tabbar" aria-label="Navigasyon prensipal" hidden></nav>
  <main id="app"><div class="splash" role="status" aria-label="Ap chaje"><div class="spl-logo"><img class="spl-ikon" src="../ikon-blan.png" alt=""><span class="spl-mak" aria-hidden="true"><span style="animation-delay:0.00s,1.20s">B</span><span style="animation-delay:0.07s,1.32s">w</span><span style="animation-delay:0.14s,1.44s">a</span><span style="animation-delay:0.21s,1.56s">t</span><span style="animation-delay:0.28s,1.68s">&nbsp;</span><span style="animation-delay:0.35s,1.80s">S</span><span style="animation-delay:0.42s,1.92s">e</span><span style="animation-delay:0.49s,2.04s">k</span><span style="animation-delay:0.56s,2.16s">r</span><span style="animation-delay:0.63s,2.28s">è</span><span style="animation-delay:0.70s,2.40s">m</span></span></div><div class="spl-bar"><i></i></div><p class="spl-t">Ap chaje…</p></div></main>
  <script src="config.js"></script>
  <script type="module" src="../app.js"></script>
</body>
</html>
